name: nexpoly CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy, such as main, a tag, or a commit SHA."
        required: false
        default: main
      monomer_md_smoke:
        description: "Run the post-deploy monomer MD CCO smoke."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      monomer_md_smoke_timeout_seconds:
        description: "Timeout in seconds for the post-deploy monomer MD CCO smoke."
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: nexpoly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Frontend and compose checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  backend-monomer-md-tests:
    name: Backend monomer MD tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polyprop
          POSTGRES_PASSWORD: polyprop
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyprop -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_POSTGRES_DSN: postgresql://polyprop:polyprop@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-monomer-md-ci.txt

      - name: Validate deployment status probe
        run: |
          bash -n scripts/deploy_server.sh
          python -m unittest discover -s scripts/tests -p 'test_monomer_backend_status_probe.py' -v

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-monomer-md-ci.txt

      - name: Run backend monomer MD tests
        working-directory: backend
        run: python -m pytest tests/test_monomer_md.py

  backend-polytao-postgres-tests:
    name: Backend PolyTAO and Postgres tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polyprop
          POSTGRES_PASSWORD: polyprop
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyprop -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_POSTGRES_DSN: postgresql://polyprop:polyprop@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-monomer-md-ci.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-monomer-md-ci.txt

      - name: Run backend PolyTAO and Postgres tests
        working-directory: backend
        run: python -m pytest tests/test_polytao.py tests/test_database_browser.py tests/test_postgres_governance.py

  worker-monomer-md-tests:
    name: Worker monomer MD tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/monomer_md_worker/requirements.txt

      - name: Install worker dependencies
        run: python -m pip install -r workers/monomer_md_worker/requirements.txt pytest==8.3.4 httpx

      - name: Run worker monomer MD tests
        run: python -m pytest workers/monomer_md_worker/tests

  deploy:
    name: Deploy nexpoly on server
    needs:
      - ci
      - backend-monomer-md-tests
      - backend-polytao-postgres-tests
      - worker-monomer-md-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: nexpoly-production
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
      DEPLOY_BRANCH: main
      NEXPOLY_SSH_HOST: ${{ secrets.NEXPOLY_SSH_HOST }}
      NEXPOLY_SSH_USER: ${{ secrets.NEXPOLY_SSH_USER }}
      NEXPOLY_SSH_PRIVATE_KEY: ${{ secrets.NEXPOLY_SSH_PRIVATE_KEY }}
      NEXPOLY_SSH_KNOWN_HOSTS: ${{ secrets.NEXPOLY_SSH_KNOWN_HOSTS }}
      NEXPOLY_SSH_PORT: ${{ vars.NEXPOLY_SSH_PORT }}
      NEXPOLY_DEPLOY_PATH: ${{ vars.NEXPOLY_DEPLOY_PATH }}
      NEXPOLY_WEB_PORT: ${{ vars.NEXPOLY_WEB_PORT }}
      NEXPOLY_MONOMER_MD_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.monomer_md_smoke || vars.NEXPOLY_MONOMER_MD_SMOKE }}
      NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.monomer_md_smoke_timeout_seconds || vars.NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS }}
    steps:
      - name: Check out deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          : "${NEXPOLY_SSH_HOST:?Missing NEXPOLY_SSH_HOST secret}"
          : "${NEXPOLY_SSH_USER:?Missing NEXPOLY_SSH_USER secret}"
          : "${NEXPOLY_SSH_PRIVATE_KEY:?Missing NEXPOLY_SSH_PRIVATE_KEY secret}"

          NEXPOLY_SSH_PORT="${NEXPOLY_SSH_PORT:-22}"
          NEXPOLY_DEPLOY_PATH="${NEXPOLY_DEPLOY_PATH:-/data/lzq/gith/nexpoly}"
          NEXPOLY_WEB_PORT="${NEXPOLY_WEB_PORT:-}"
          NEXPOLY_MONOMER_MD_SMOKE="${NEXPOLY_MONOMER_MD_SMOKE:-false}"
          NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS="${NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS:-300}"

          case "$DEPLOY_REF" in
            *[!A-Za-z0-9._/@:-]*)
              echo "DEPLOY_REF contains unsupported characters: $DEPLOY_REF" >&2
              exit 1
              ;;
          esac

          case "$NEXPOLY_SSH_PORT" in
            *[!0-9]*|"")
              echo "NEXPOLY_SSH_PORT must be numeric." >&2
              exit 1
              ;;
          esac

          if [[ -n "$NEXPOLY_WEB_PORT" ]]; then
            case "$NEXPOLY_WEB_PORT" in
              *[!0-9]*)
                echo "NEXPOLY_WEB_PORT must be numeric when provided." >&2
                exit 1
                ;;
            esac
          fi

          case "$NEXPOLY_MONOMER_MD_SMOKE" in
            true|1|yes|enabled|false|0|no|disabled)
              ;;
            *)
              echo "NEXPOLY_MONOMER_MD_SMOKE must be true or false." >&2
              exit 1
              ;;
          esac

          case "$NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS" in
            *[!0-9]*|"")
              echo "NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS must be numeric." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$NEXPOLY_SSH_PRIVATE_KEY" > ~/.ssh/nexpoly_deploy_key
          chmod 600 ~/.ssh/nexpoly_deploy_key

          if [[ -n "${NEXPOLY_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$NEXPOLY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$NEXPOLY_SSH_PORT" "$NEXPOLY_SSH_HOST" >> ~/.ssh/known_hosts
          fi

          {
            echo "NEXPOLY_SSH_PORT=$NEXPOLY_SSH_PORT"
            echo "NEXPOLY_DEPLOY_PATH=$NEXPOLY_DEPLOY_PATH"
            if [[ -n "$NEXPOLY_WEB_PORT" ]]; then
              echo "NEXPOLY_WEB_PORT=$NEXPOLY_WEB_PORT"
            fi
            echo "NEXPOLY_MONOMER_MD_SMOKE=$NEXPOLY_MONOMER_MD_SMOKE"
            echo "NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS=$NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS"
          } >> "$GITHUB_ENV"

      - name: Create deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle_name="nexpoly-${GITHUB_SHA}.bundle"
          bundle_path="${RUNNER_TEMP}/${bundle_name}"
          bundle_ref="refs/heads/nexpoly-deploy-${GITHUB_SHA}"

          git update-ref "$bundle_ref" HEAD
          git update-ref "refs/heads/${DEPLOY_BRANCH}" HEAD
          git bundle create "$bundle_path" "refs/heads/${DEPLOY_BRANCH}" "$bundle_ref" --tags
          git bundle verify "$bundle_path"

          {
            echo "NEXPOLY_BUNDLE_NAME=$bundle_name"
            echo "NEXPOLY_BUNDLE_PATH=$bundle_path"
          } >> "$GITHUB_ENV"

      - name: Upload deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          remote_incoming="${NEXPOLY_DEPLOY_PATH%/}/ops/incoming"
          remote_bundle="${remote_incoming}/${NEXPOLY_BUNDLE_NAME}"

          ssh \
            -i ~/.ssh/nexpoly_deploy_key \
            -p "$NEXPOLY_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$NEXPOLY_SSH_USER@$NEXPOLY_SSH_HOST" \
            "mkdir -p $(printf '%q' "$remote_incoming")"

          scp \
            -i ~/.ssh/nexpoly_deploy_key \
            -P "$NEXPOLY_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$NEXPOLY_BUNDLE_PATH" \
            "$NEXPOLY_SSH_USER@$NEXPOLY_SSH_HOST:$remote_bundle"

          echo "NEXPOLY_REMOTE_BUNDLE=$remote_bundle" >> "$GITHUB_ENV"

      - name: Run server deployment
        shell: bash
        run: |
          set -euo pipefail

          remote_path="$(printf '%q' "$NEXPOLY_DEPLOY_PATH")"
          remote_ref="$(printf '%q' "$DEPLOY_REF")"
          remote_bundle="$(printf '%q' "$NEXPOLY_REMOTE_BUNDLE")"
          remote_command="cd ${remote_path} && NEXPOLY_DEPLOY_REF=${remote_ref} NEXPOLY_DEPLOY_BRANCH=main NEXPOLY_DEPLOY_BUNDLE=${remote_bundle}"
          if [[ -n "${NEXPOLY_WEB_PORT:-}" ]]; then
            remote_web_port="$(printf '%q' "$NEXPOLY_WEB_PORT")"
            remote_command="${remote_command} NEXPOLY_WEB_PORT=${remote_web_port}"
          fi
          remote_monomer_smoke="$(printf '%q' "$NEXPOLY_MONOMER_MD_SMOKE")"
          remote_monomer_smoke_timeout="$(printf '%q' "$NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS")"
          remote_command="${remote_command} NEXPOLY_MONOMER_MD_SMOKE=${remote_monomer_smoke} NEXPOLY_MONOMER_MD_SMOKE_TIMEOUT_SECONDS=${remote_monomer_smoke_timeout}"
          remote_command="${remote_command} bash -s"

          ssh \
            -i ~/.ssh/nexpoly_deploy_key \
            -p "$NEXPOLY_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$NEXPOLY_SSH_USER@$NEXPOLY_SSH_HOST" \
            "$remote_command" <<'REMOTE_BOOTSTRAP'
          set -euo pipefail

          : "${NEXPOLY_DEPLOY_REF:?Missing NEXPOLY_DEPLOY_REF}"
          : "${NEXPOLY_DEPLOY_BUNDLE:?Missing NEXPOLY_DEPLOY_BUNDLE}"
          DEPLOY_BRANCH="${NEXPOLY_DEPLOY_BRANCH:-main}"

          case "$NEXPOLY_DEPLOY_REF" in
            *[!A-Za-z0-9._/@:-]*)
              echo "NEXPOLY_DEPLOY_REF contains unsupported characters: $NEXPOLY_DEPLOY_REF" >&2
              exit 1
              ;;
          esac

          git diff --quiet || {
            echo "Deployment checkout has unstaged tracked changes." >&2
            exit 1
          }
          git diff --cached --quiet || {
            echo "Deployment checkout has staged tracked changes." >&2
            exit 1
          }

          if [[ ! -f "$NEXPOLY_DEPLOY_BUNDLE" ]]; then
            echo "Deployment bundle is missing: $NEXPOLY_DEPLOY_BUNDLE" >&2
            exit 1
          fi

          git bundle verify "$NEXPOLY_DEPLOY_BUNDLE" >/dev/null
          git fetch --prune "$NEXPOLY_DEPLOY_BUNDLE" '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

          if [[ "$NEXPOLY_DEPLOY_REF" == "$DEPLOY_BRANCH" || "$NEXPOLY_DEPLOY_REF" == "refs/heads/$DEPLOY_BRANCH" || "$NEXPOLY_DEPLOY_REF" == "origin/$DEPLOY_BRANCH" ]]; then
            target_commit="$(git rev-parse "origin/$DEPLOY_BRANCH^{commit}")"
            if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            fi
            git merge --ff-only "$target_commit"
            [[ "$(git rev-parse HEAD)" == "$target_commit" ]] || {
              echo "Branch HEAD does not match fetched target commit." >&2
              exit 1
            }
          elif git rev-parse --verify --quiet "origin/${NEXPOLY_DEPLOY_REF}^{commit}" >/dev/null; then
            git checkout --detach "$(git rev-parse "origin/${NEXPOLY_DEPLOY_REF}^{commit}")"
          elif git rev-parse --verify --quiet "${NEXPOLY_DEPLOY_REF}^{commit}" >/dev/null; then
            git checkout --detach "$(git rev-parse "${NEXPOLY_DEPLOY_REF}^{commit}")"
          else
            echo "Cannot resolve deploy ref after fetch: $NEXPOLY_DEPLOY_REF" >&2
            exit 1
          fi

          if [[ ! -f scripts/deploy_server.sh ]]; then
            echo "Target ref does not contain scripts/deploy_server.sh; it cannot be deployed by this pipeline." >&2
            exit 1
          fi

          bash scripts/deploy_server.sh
          REMOTE_BOOTSTRAP
