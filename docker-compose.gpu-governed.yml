# Explicit opt-in only. Render this file last, after the normal dev or prod
# override, during an authorized MPS/Broker maintenance deployment.
services:
  backend:
    user: "1001:1001"
    environment:
      GPU_BROKER_ENABLED: "true"
      GPU_BROKER_SOCKET_PATH: "/app/gpu-mps/broker.sock"
      GPU_MPS_PIPE_ROOT: "/app/gpu-mps"
    labels:
      com.nexpoly.gpu.registration: "backend-${GPU_BROKER_ENVIRONMENT:-dev}"
      com.nexpoly.gpu.component: "backend"
      com.nexpoly.gpu.environment: "${GPU_BROKER_ENVIRONMENT:-dev}"
    volumes:
      - ${NEXPOLY_GPU_STATE_ROOT:-/data/lzq/gith/nexpoly-runtime/state/gpu-resource}:/app/gpu-mps:rw
