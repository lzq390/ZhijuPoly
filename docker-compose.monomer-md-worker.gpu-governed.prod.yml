name: nexpoly-monomer-md-worker

# Explicit production opt-in. GPU0 is never exposed. This override remains
# unused until the separately authorized MPS/Broker production maintenance.
services:
  monomer-md-worker:
    user: "1001:1001"
    environment:
      MONOMER_MD_GPU_BROKER_ENABLED: "true"
      MONOMER_MD_GPU_BROKER_ENVIRONMENT: "prod"
      MONOMER_MD_GPU_BROKER_SOCKET_PATH: "/app/gpu-mps/broker.sock"
      MONOMER_MD_GPU_MPS_PIPE_ROOT: "/app/gpu-mps"
    labels:
      com.nexpoly.gpu.registration: "md-prod"
      com.nexpoly.gpu.component: "md"
      com.nexpoly.gpu.environment: "prod"
    volumes:
      - ${NEXPOLY_GPU_STATE_ROOT:-/data/lzq/gith/nexpoly/ops/state/gpu-resource}:/app/gpu-mps:rw
    gpus: !override
      - driver: nvidia
        device_ids: ["1", "2", "3"]
        capabilities: [gpu]
