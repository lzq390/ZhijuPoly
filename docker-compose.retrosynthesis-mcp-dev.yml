# Standalone Retrosynthesis adapter; never merge into the application or production stack.
name: nexpoly_retrosynthesis_mcp_dev

services:
  retrosynthesis-mcp:
    image: nexpoly-retrosynthesis-mcp:dev
    build:
      context: .
      dockerfile: Dockerfile.retrosynthesis-mcp
      network: host
      args: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    user: "${NEXPOLY_RETROSYNTHESIS_MCP_DEV_UID:?use scripts/retrosynthesis_mcp_dev.py}:${NEXPOLY_RETROSYNTHESIS_MCP_DEV_GID:?use scripts/retrosynthesis_mcp_dev.py}"
    environment:
      NEXPOLY_RETROSYNTHESIS_MCP_BACKEND_URL: http://nexpoly_dev-backend-1:8000
      NEXPOLY_RETROSYNTHESIS_MCP_ACCOUNT_UUID: ${NEXPOLY_RETROSYNTHESIS_MCP_DEV_ACCOUNT_UUID:?use scripts/retrosynthesis_mcp_dev.py}
      NEXPOLY_RETROSYNTHESIS_MCP_SESSION_FILE: /run/retrosynthesis-mcp/session.json
      NEXPOLY_RETROSYNTHESIS_MCP_CLIENTS_FILE: /run/retrosynthesis-mcp/clients.json
      NEXPOLY_RETROSYNTHESIS_MCP_JOURNAL_FILE: /var/lib/retrosynthesis-mcp/submissions.sqlite3
      NEXPOLY_RETROSYNTHESIS_MCP_HOST: 0.0.0.0
      NEXPOLY_RETROSYNTHESIS_MCP_PORT: "18211"
      NEXPOLY_RETROSYNTHESIS_MCP_ALLOWED_HOSTS: "127.0.0.1:18211,localhost:18211,nexpoly_retrosynthesis_mcp_dev-retrosynthesis-mcp-1:18211"
      NEXPOLY_RETROSYNTHESIS_MCP_ALLOWED_ORIGINS: ""
      NEXPOLY_RETROSYNTHESIS_MCP_RATE_LIMIT: "60"
      NEXPOLY_RETROSYNTHESIS_MCP_MAX_CONCURRENCY: "2"
      NEXPOLY_RETROSYNTHESIS_MCP_TOOL_TIMEOUT_SECONDS: "25"
    volumes:
      - type: bind
        source: ${NEXPOLY_RETROSYNTHESIS_MCP_DEV_RUNTIME:?use scripts/retrosynthesis_mcp_dev.py}
        target: /run/retrosynthesis-mcp
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NEXPOLY_RETROSYNTHESIS_MCP_DEV_JOURNAL:?use scripts/retrosynthesis_mcp_dev.py}
        target: /var/lib/retrosynthesis-mcp
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    restart: "no"
    stop_grace_period: 30s
    networks: [development-backend, development-clients]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18211/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  development-backend:
    external: true
    name: nexpoly_dev_default
  development-clients:
    name: nexpoly_retrosynthesis_mcp_clients_dev
    internal: true
