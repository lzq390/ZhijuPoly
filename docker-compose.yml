name: nexpoly

x-backend-environment: &backend-environment
  MODEL_DIR: /app/model
  MODEL_ENABLED: "true"
  GEN_MODEL_ENABLED: "${GEN_MODEL_ENABLED:-false}"
  GEN_MODEL_DIR: /app/model/conditional_generation
  GEN_DEVICE: "${GEN_DEVICE:-auto}"
  GEN_JOB_WORKERS: "${GEN_JOB_WORKERS:-1}"
  RETRO_MODEL_ENABLED: "${RETRO_MODEL_ENABLED:-true}"
  RETRO_MODEL_ID: "${RETRO_MODEL_ID:-/app/model/reactiont5-retrosynthesis}"
  RETRO_DEVICE: "${RETRO_DEVICE:-auto}"
  STRUCTURED_DATA_BACKEND: "${STRUCTURED_DATA_BACKEND:-postgres}"
  APP_POSTGRES_DSN: "${APP_POSTGRES_DSN:-postgresql://polyprop:polyprop@lab-postgres:5432/nexpoly}"
  PI_REVERSE_BACKEND: "${PI_REVERSE_BACKEND:-postgres}"
  PI_POSTGRES_DSN: "${PI_POSTGRES_DSN:-postgresql://polyprop:polyprop@lab-postgres:5432/nexpoly}"
  LAB_DATA_POSTGRES_DSN: "${LAB_DATA_POSTGRES_DSN:-postgresql://polyprop:polyprop@lab-postgres:5432/nexpoly}"
  PI_REVERSE_TG_WINDOW_CELSIUS: "50"
  PI_REVERSE_TG_MAX_WINDOW_CELSIUS: "200"
  PI_REVERSE_MAX_SCAN_ROWS: "500000"
  PI_REVERSE_TIMEOUT_SECONDS: "30"
  PI_REVERSE_JOB_WORKERS: "1"
  PI_REVERSE_JOB_BATCH_SIZE: "20000"
  PI_REVERSE_PROGRESS_INTERVAL_ROWS: "50000"
  ALLOWED_ORIGINS: "http://localhost:${NEXPOLY_WEB_PORT:-9000},http://127.0.0.1:${NEXPOLY_WEB_PORT:-9000}"

x-backend-volumes: &backend-volumes
  - ./backend/data:/app/backend/data:ro
  - ./database:/app/database:ro
  - ./model/ocsr:/app/model/ocsr:ro
  - ./model/conditional_generation:/app/model/conditional_generation:ro
  - ./model/reactiont5-retrosynthesis:/app/model/reactiont5-retrosynthesis:ro

services:
  postgres-init:
    image: nexpoly-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - path: .env.ai
        required: false
    environment: *backend-environment
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lab-postgres:
        condition: service_healthy
    command: ["python", "-m", "app.import_postgres", "--dataset", "all", "--refresh-analytics-snapshot"]

  backend:
    image: nexpoly-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    gpus:
      - driver: nvidia
        device_ids:
          - "${NEXPOLY_GPU_DEVICE:-2}"
        capabilities:
          - gpu
    restart: unless-stopped
    env_file:
      - path: .env.ai
        required: false
    environment: *backend-environment
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -m app.postgres_preflight --strict >/tmp/nexpoly-preflight.json &&
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lab-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyprop
      POSTGRES_PASSWORD: polyprop
      POSTGRES_DB: nexpoly
    ports:
      - "${NEXPOLY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyprop -d nexpoly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nexpoly-nginx:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${NEXPOLY_WEB_PORT:-9000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_postgres_data:
