name: nexpoly

x-backend-environment: &backend-environment
  WEB_CONCURRENCY: "1"
  MODEL_DIR: /app/model
  MODEL_ENABLED: "true"
  GEN_MODEL_ENABLED: "${GEN_MODEL_ENABLED:-false}"
  GEN_MODEL_DIR: /app/model/conditional_generation
  GEN_DEVICE: "${GEN_DEVICE:-auto}"
  GEN_JOB_WORKERS: "${GEN_JOB_WORKERS:-1}"
  GEN_MAX_ACTIVE_JOBS: "${GEN_MAX_ACTIVE_JOBS:-8}"
  GPU_PRELOAD_MODE: "${GPU_PRELOAD_MODE:-lazy}"
  GPU_MAX_CONCURRENT_INFERENCES: "${GPU_MAX_CONCURRENT_INFERENCES:-1}"
  GPU_MAX_WAITING_INFERENCES: "${GPU_MAX_WAITING_INFERENCES:-8}"
  GPU_SYNC_QUEUE_TIMEOUT_SECONDS: "${GPU_SYNC_QUEUE_TIMEOUT_SECONDS:-30}"
  GPU_ASYNC_QUEUE_TIMEOUT_SECONDS: "${GPU_ASYNC_QUEUE_TIMEOUT_SECONDS:-600}"
  GPU_BROKER_ENABLED: "${GPU_BROKER_ENABLED:-false}"
  GPU_BROKER_SOCKET_PATH: "${GPU_BROKER_SOCKET_PATH:-/run/user/1001/nexpoly-gpu/broker.sock}"
  GPU_MPS_PIPE_ROOT: "${GPU_MPS_PIPE_ROOT:-./.runtime/gpu-resource}"
  GPU_BROKER_ENVIRONMENT: "${GPU_BROKER_ENVIRONMENT:-dev}"
  GPU_BROKER_WAIT_TIMEOUT_SECONDS: "${GPU_BROKER_WAIT_TIMEOUT_SECONDS:-45}"
  GPU_BROKER_HEARTBEAT_INTERVAL_SECONDS: "${GPU_BROKER_HEARTBEAT_INTERVAL_SECONDS:-5}"
  POLYTAO_ENABLED: "${POLYTAO_ENABLED:-false}"
  POLYTAO_MODEL_DIR: /app/model/polytao
  POLYTAO_DEVICE: "${POLYTAO_DEVICE:-auto}"
  POLYTAO_JOB_THREADS: "${POLYTAO_JOB_THREADS:-1}"
  RETRO_MODEL_ENABLED: "${RETRO_MODEL_ENABLED:-true}"
  RETRO_MODEL_ID: "${RETRO_MODEL_ID:-/app/model/reactiont5-retrosynthesis}"
  RETRO_DEVICE: "${RETRO_DEVICE:-auto}"
  STRUCTURED_DATA_BACKEND: "${STRUCTURED_DATA_BACKEND:-postgres}"
  DEPLOYMENT_DRAIN_ENABLED: "true"
  APP_POSTGRES_DSN: "${APP_POSTGRES_DSN:-}"
  PI_REVERSE_BACKEND: "${PI_REVERSE_BACKEND:-postgres}"
  PI_POSTGRES_DSN: "${PI_POSTGRES_DSN:-}"
  LAB_DATA_POSTGRES_DSN: "${LAB_DATA_POSTGRES_DSN:-}"
  PI_REVERSE_TG_WINDOW_CELSIUS: "50"
  PI_REVERSE_TG_MAX_WINDOW_CELSIUS: "200"
  PI_REVERSE_MAX_SCAN_ROWS: "500000"
  PI_REVERSE_TIMEOUT_SECONDS: "30"
  PI_REVERSE_JOB_WORKERS: "1"
  PI_REVERSE_JOB_BATCH_SIZE: "20000"
  PI_REVERSE_PROGRESS_INTERVAL_ROWS: "50000"
  MONOMER_MD_WORKER_BASE_URL: "${MONOMER_MD_WORKER_BASE_URL:-}"
  MONOMER_MD_WORKER_TIMEOUT_SECONDS: "${MONOMER_MD_WORKER_TIMEOUT_SECONDS:-15}"
  MONOMER_MD_DEFAULT_STEPS: "300"
  MONOMER_MD_SUBMIT_ENABLED: "${MONOMER_MD_SUBMIT_ENABLED:-true}"
  MONOMER_MD_RATE_LIMIT_PER_IP_PER_MINUTE: "${MONOMER_MD_RATE_LIMIT_PER_IP_PER_MINUTE:-3}"
  MONOMER_MD_RATE_LIMIT_WINDOW_SECONDS: "${MONOMER_MD_RATE_LIMIT_WINDOW_SECONDS:-60}"
  MONOMER_MD_MAX_ACTIVE_JOBS: "${MONOMER_MD_MAX_ACTIVE_JOBS:-1}"
  MONOMER_MD_CANARY_STATE_DIR: "/app/monomer-md-canaries"
  POLYTAO_RATE_LIMIT_PER_IP_PER_MINUTE: "${POLYTAO_RATE_LIMIT_PER_IP_PER_MINUTE:-5}"
  POLYTAO_RATE_LIMIT_WINDOW_SECONDS: "${POLYTAO_RATE_LIMIT_WINDOW_SECONDS:-60}"
  POLYTAO_MAX_ACTIVE_JOBS: "${POLYTAO_MAX_ACTIVE_JOBS:-1}"
  ALLOWED_ORIGINS: "http://localhost:${NEXPOLY_WEB_PORT:-9000},http://127.0.0.1:${NEXPOLY_WEB_PORT:-9000}"

x-backend-asset-volumes: &backend-asset-volumes
  - ${NEXPOLY_ASSET_ROOT:-.}/backend-data:/app/backend/data:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/database:/app/database:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/ocsr:/app/model/ocsr:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/conditional_generation:/app/model/conditional_generation:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/reactiont5-retrosynthesis:/app/model/reactiont5-retrosynthesis:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/polytao:/app/model/polytao:ro

x-backend-volumes: &backend-volumes
  - ${NEXPOLY_ASSET_ROOT:-.}/backend-data:/app/backend/data:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/database:/app/database:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/ocsr:/app/model/ocsr:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/conditional_generation:/app/model/conditional_generation:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/reactiont5-retrosynthesis:/app/model/reactiont5-retrosynthesis:ro
  - ${NEXPOLY_ASSET_ROOT:-.}/model/polytao:/app/model/polytao:ro
  - ${MONOMER_MD_WORKER_SOCKET_DIR:-./.runtime/monomer-md-worker-socket}:/app/monomer-md-worker:ro
  - ${NEXPOLY_RUNTIME_ROOT:-./.runtime}/state/monomer-md-canaries:/app/monomer-md-canaries:rw

services:
  postgres-init:
    image: nexpoly-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: "${NEXPOLY_BUILD_REVISION:-dev}"
    restart: "no"
    env_file:
      - path: .env.ai
        required: false
    environment: *backend-environment
    # Migrations never call the host Worker.  Keeping its socket out of this
    # one-shot container also prevents maintenance commands from inheriting a
    # production-only control channel.
    volumes: *backend-asset-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lab-postgres:
        condition: service_healthy
    command: ["python", "-m", "app.postgres_migrations", "--mode", "bootstrap"]

  backend:
    image: nexpoly-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: "${NEXPOLY_BUILD_REVISION:-dev}"
    gpus:
      - driver: nvidia
        device_ids:
          - "${NEXPOLY_GPU_DEVICE:-2}"
        capabilities:
          - gpu
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env.ai
        required: false
    environment: *backend-environment
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -m app.postgres_preflight --strict >/tmp/nexpoly-postgres-preflight.json &&
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()" &&
          python -m app.gpu_preflight --mode "$$(if [ "$$GPU_PRELOAD_MODE" = required ]; then echo ready; else echo configured; fi)" >/tmp/nexpoly-gpu-preflight.json
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  lab-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${NEXPOLY_POSTGRES_USER:-nexpoly}"
      POSTGRES_PASSWORD: "${NEXPOLY_POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${NEXPOLY_POSTGRES_DB:-nexpoly}"
    ports:
      - "127.0.0.1:${NEXPOLY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nexpoly-nginx:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${NEXPOLY_WEB_PORT:-9000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_postgres_data:
