services:
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/backend/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
