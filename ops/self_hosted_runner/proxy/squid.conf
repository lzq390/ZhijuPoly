http_port 127.0.0.1:@PROXY_PORT@
visible_hostname nexpoly-ci-proxy
pid_filename /run/nexpoly-runner-proxy/squid.pid
cache_effective_user nexpoly-proxy
cache_effective_group nexpoly-proxy
dns_nameservers @DNS@

acl loopback src 127.0.0.1/32
acl CONNECT method CONNECT
acl ssl_ports port 443
acl http_ports port 80
acl safe_ports port 80 443
acl permitted_domains dstdomain -n "/etc/nexpoly-runner/proxy-domains.txt"
acl forbidden_targets dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 114.214.255.0/24 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl host_targets dst @HOST_ADDRESSES@
http_access deny !loopback
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny !CONNECT !http_ports
http_access deny !permitted_domains
http_access deny forbidden_targets
http_access deny host_targets
http_access allow loopback permitted_domains
http_access deny all

cache_peer 127.0.0.1 parent @UPSTREAM_PORT@ 0 no-query default name=ci_parent
cache_peer_access ci_parent allow permitted_domains
cache_peer_access ci_parent deny all
never_direct allow all
cache deny all
cache_mem 16 MB
pinger_enable off
maximum_object_size 0 KB
forwarded_for delete
via off
# No request URLs, query strings, credentials or opaque download tokens are kept.
access_log none
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
shutdown_lifetime 3 seconds
request_timeout 2 minutes
connect_timeout 15 seconds
