[Service]
# Override the legacy bridge-interface reconciler. Source subnet and gateway
# contracts remain valid when Docker replaces a generated br-<network-id> link.
ExecStart=
ExecStart=/usr/bin/python3 -I -B /usr/local/libexec/nexpoly-tunnel-proxy-firewall-stable start
ExecStop=
ExecStop=/usr/bin/python3 -I -B /usr/local/libexec/nexpoly-tunnel-proxy-firewall-stable stop
