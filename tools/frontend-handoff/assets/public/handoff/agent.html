<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenScience · 前端交付演示</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #13243c; font-family: "IBM Plex Sans", "PingFang SC", sans-serif; }
    main { width: min(100%, 700px); padding: 48px 28px; } small { color: #0f766e; letter-spacing: .16em; } h1 { margin: 20px 0; font: 600 36px "Exo", sans-serif; } p { color: #55667d; line-height: 1.8; }
    .card { border: 1px solid #dbe4ed; border-radius: 14px; padding: 22px; background: white; margin-top: 28px; } .tag { display: inline-block; border-radius: 20px; background: #e6f7f3; color: #0f766e; padding: 6px 12px; font-size: 13px; }
  </style>
</head>
<body><main>
  <small>OPENSCIENCE WORKSPACE</small>
  <h1>科研智能体工作区</h1>
  <p>这是前端交付包中的本地占位页面，用于调整嵌入区域、导航与页面布局。</p>
  <div class="card"><span class="tag">本地演示</span><p>独立智能体服务未包含在此包内。研究模块和公共界面可通过侧边导航继续查看。</p></div>
</main></body>
</html>
